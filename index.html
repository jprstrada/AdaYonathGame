<style>

</div></div>
<script>

{x:0,n:'Jerusalém',t:[255,205,120],b:[255,242,205],g:'#c98b3a',g2:'#a8702a'},
{x:800,n:'Instituto Weizmann',t:[50,165,185],b:[200,240,240],g:'#1b7f86',g2:'#136269'},
{x:1650,n:'O desafio do ribossomo',t:[115,65,200],b:[225,205,250],g:'#6a3bb8',g2:'#512c91'},
{x:2600,n:'Antibióticos',t:[55,160,100],b:[205,240,215],g:'#2a8a52',g2:'#1f6b3f'},
{x:3300,n:'Prêmio Nobel',t:[10,40,110],b:[250,215,110],g:'#d9a520',g2:'#a97f12'}];

{x:420,y:'1939',t:'Nasce em Jerusalém',d:'Ada Yonath nasceu em Jerusalém, numa família humilde. Mesmo com poucos recursos, sua curiosidade levou à ciência.'},
{x:700,y:'Faculdade',t:'Estudando Química',d:'Ada estudou Química na Universidade Hebraica de Jerusalém e aprendeu como as moléculas são construídas.'},
{x:1000,y:'1968',t:'Doutorado no Weizmann',d:'Ada concluiu o doutorado no Instituto Weizmann, em Israel, estudando estruturas com raios X (cristalografia).'},
{x:1350,y:'Anos 1970',t:'Um laboratório pioneiro',d:'No Weizmann, ela montou o primeiro laboratório de cristalografia de proteínas de Israel.'},

{x:2300,y:'A ideia genial',t:'Frio e bactérias extremas',d:'Ela usou bactérias de ambientes extremos e congelou os cristais em temperaturas muito baixas para protegê-los dos raios X.'},
{x:2900,y:'Medicina',t:'Antibióticos mais inteligentes',d:'Seu trabalho mostrou como vários antibióticos atacam o ribossomo das bactérias, ajudando a criar remédios melhores.'}];

function ov(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function zi(px){var k=0;for(var i=0;i<Z.length;i++)if(px>=Z[i].x)k=i;return k}

p={x:60,y:GY-36,w:22,h:36,vx:0,vy:0,on:0,f:1};S=[];
I.forEach(function(o,i){S.push({x:o.x,y:230,w:40,h:40,o:o,hit:0,bump:0});if(i%2==0){S.push({x:o.x-40,y:230,w:40,h:40});S.push({x:o.x+40,y:230,w:40,h:40})}});

function step(){
var a=(K.r?1:0)-(K.l?1:0);p.vx=a*3.3;if(a)p.f=a;
if(K.j&&p.on){p.vy=-13;p.on=0}else if(!K.j&&p.vy<-5)p.vy=-5;

p.y+=p.vy;p.on=0;
if(p.y+p.h>=GY){p.y=GY-p.h;p.vy=0;p.on=1}
S.forEach(function(s){if(ov(p,s)){if(p.vy>0){p.y=s.y-p.h;p.vy=0;p.on=1}else if(p.vy<0){p.y=s.y+s.h;p.vy=0;if(s.o&&!s.hit)hitB(s)}}});

if(inv>0)inv--;if(mt>0)mt--;

e.x+=e.s;if(e.x<e.a){e.x=e.a;e.s=Math.abs(e.s)}if(e.x>e.b){e.x=e.b;e.s=-Math.abs(e.s)}

if(ov(p,eb)){if(p.vy>0&&p.y+p.h-eb.y<18){e.d=25;p.vy=-9;p.on=0;kill++;msg=NM[e.t]+' derrotada!';mt=90}
else if(inv<=0){lives--;inv=100;p.vy=-8;p.on=0;p.x=Math.max(0,p.x+(p.x<e.x?-16:16));if(lives<=0)gameOver()}}});
var z=zi(p.x);if(z!=zn){zn=z;zt=150}if(zt>0)zt--;
cam=Math.max(0,Math.min(LEN-W,p.x-300));

else if(t=='flask'){x.fillStyle='rgba(255,255,255,.55)';x.strokeStyle='#fff';x.lineWidth=3;x.beginPath();x.moveTo(-10,-70);x.lineTo(10,-70);x.lineTo(10,-42);x.lineTo(32,0);x.lineTo(-32,0);x.lineTo(-10,-42);x.closePath();x.fill();x.stroke();x.fillStyle='#17c3b8';x.beginPath();x.moveTo(-20,-18);x.lineTo(20,-18);x.lineTo(32,0);x.lineTo(-32,0);x.closePath();x.fill()}

else{x.fillStyle='#8be8ad';x.strokeStyle='#1f6b3f';x.lineWidth=3;x.beginPath();x.ellipse(0,-26,40,20,-.3,0,2*PI);x.fill();x.stroke();x.fillStyle='#1f6b3f';for(var j=0;j<4;j++){x.beginPath();x.arc(-18+j*12,-26+(j%2)*6-3,3,0,2*PI);x.fill()}x.strokeStyle='#8be8ad';x.beginPath();x.moveTo(36,-40);x.quadraticCurveTo(54,-56,64,-40);x.stroke()}
x.restore()}
function eyes(){x.fillStyle='#fff';x.beginPath();x.ellipse(-6,-2,4.5,5.5,0,0,2*PI);x.fill();x.beginPath();x.ellipse(6,-2,4.5,5.5,0,0,2*PI);x.fill();x.fillStyle='#111';x.beginPath();x.arc(-5,-1,2,0,2*PI);x.fill();x.beginPath();x.arc(5,-1,2,0,2*PI);x.fill();x.strokeStyle='#111';x.lineWidth=2.5;x.beginPath();x.moveTo(-11,-10);x.lineTo(-2,-6);x.moveTo(11,-10);x.lineTo(2,-6);x.stroke()}
function enemy(e){if(e.gone)return;x.save();x.translate(e.x+14,GY);if(e.d>0)x.scale(1,.3);var t=e.t,i,a;
x.fillStyle=CL[t];x.strokeStyle='#222';x.lineWidth=2;
if(t==2){x.beginPath();x.moveTo(0,-27);x.lineTo(14,-13);x.lineTo(0,0);x.lineTo(-14,-13);x.closePath();x.fill();x.stroke();x.strokeStyle='#2f7a88';x.lineWidth=1.5;x.beginPath();x.moveTo(-4,-26);x.lineTo(2,-19);x.lineTo(-3,-14);x.stroke()}
else if(t==1){x.strokeStyle='#e08a00';x.lineWidth=3;for(i=0;i<8;i++){a=i*PI/4+frame*.03;x.beginPath();x.moveTo(Math.cos(a)*10,-13+Math.sin(a)*10);x.lineTo(Math.cos(a)*16,-13+Math.sin(a)*16);x.stroke()}x.strokeStyle='#222';x.lineWidth=2;x.beginPath();x.arc(0,-13,11,0,2*PI);x.fill();x.stroke()}
else{x.beginPath();x.ellipse(0,-12,14,12,0,0,2*PI);x.fill();x.stroke();
if(t==0){x.beginPath();x.arc(-7,-23,6,0,2*PI);x.fill();x.stroke();x.beginPath();x.arc(6,-24,6,0,2*PI);x.fill();x.stroke()}
else{x.strokeStyle='#1f6b3f';x.lineWidth=3;for(i=-1;i<2;i++){x.beginPath();x.moveTo(i*9,-2);x.lineTo(i*9+Math.sin(frame*.3+i)*3,3);x.stroke()}}}
x.translate(0,-13);eyes();x.restore()}
function trophy(){x.save();x.translate(TX,GY);x.fillStyle='#0038b8';x.fillRect(-26,-22,52,22);x.fillStyle='#fff';x.font='bold 10px sans-serif';x.textAlign='center';x.fillText('NOBEL',0,-8);
x.fillStyle='#ffd23f';x.strokeStyle='#b57f00';x.lineWidth=3;x.beginPath();x.moveTo(-24,-90);x.lineTo(24,-90);x.quadraticCurveTo(24,-48,0,-42);x.quadraticCurveTo(-24,-48,-24,-90);x.closePath();x.fill();x.stroke();x.fillRect(-5,-42,10,20);
x.beginPath();x.arc(-26,-74,10,PI*.5,PI*1.5);x.stroke();x.beginPath();x.arc(26,-74,10,PI*1.5,PI*.5);x.stroke();
var s=Math.sin(frame*.1)*3;x.fillStyle='#fff';x.font='18px sans-serif';x.fillText('✦',-38,-100+s);x.fillText('✦',36,-96-s);x.restore()}

var w=p.on&&p.vx?Math.sin(frame*.35)*4:0;
x.fillStyle='#1a2a5e';x.fillRect(-9+w,27,8,9);x.fillRect(1-w,27,8,9);

x.fillStyle='#0038b8';x.fillRect(-2,14,4,15);
x.fillStyle='#fff';x.fillRect(2,16+(p.on?0:-5),6,10);x.strokeRect(2,16+(p.on?0:-5),6,10);

x.fillStyle='#5b3a24';x.beginPath();x.arc(0,5,10,PI*1.02,PI*1.98);x.closePath();x.fill();

x.strokeStyle='#222';x.lineWidth=1.5;x.strokeRect(1,5,7,5);x.fillStyle='#222';x.fillRect(5,7,2,2);

function draw(){

S.forEach(function(s){if(s.x>cam+W||s.x+s.w<cam)return;var by=s.y-(s.bump>0?Math.sin(s.bump/8*PI)*8:0);

else{x.fillStyle='#0038b8';x.fillRect(s.x,s.y,s.w,s.h);x.strokeStyle='#fff';x.lineWidth=2;for(var u=s.x;u<s.x+s.w;u+=40)for(var v=s.y;v<s.y+s.h;v+=20)x.strokeRect(u+1,v+1,Math.min(40,s.x+s.w-u)-2,Math.min(20,s.y+s.h-v)-2)}});
E.forEach(enemy);
C.forEach(function(c){if(c.g)return;var by=c.y+Math.sin(frame*.08+c.x)*3;x.fillStyle='#ffd23f';x.strokeStyle='#b57f00';x.lineWidth=2;x.beginPath();x.arc(c.x,by,7,0,2*PI);x.fill();x.stroke();x.fillStyle='#fff';x.beginPath();x.arc(c.x-2,by-2,2,0,2*PI);x.fill()});
x.restore();
if(inv<=0||frame%6<3)ada();
x.textAlign='left';x.font='bold 16px sans-serif';x.lineWidth=3;x.strokeStyle='rgba(0,0,0,.6)';x.fillStyle='#fff';
var h='★ '+found+'/'+I.length+'    ⚛ '+sc+'/'+total;x.strokeText(h,12,24);x.fillText(h,12,24);
x.font='26px sans-serif';x.textAlign='right';for(var i=0;i<3;i++){x.fillStyle=i<lives?'#ff4d6d':'rgba(0,0,0,.35)';x.strokeText('♥',W-14-(2-i)*28,28);x.fillText('♥',W-14-(2-i)*28,28)}x.textAlign='left';x.font='bold 16px sans-serif';x.fillStyle='#fff';
if(zt>0&&zn>=0){x.globalAlpha=Math.min(1,zt/30);x.textAlign='center';x.font='bold 22px sans-serif';x.strokeText(Z[zn].n,W/2,60);x.fillText(Z[zn].n,W/2,60);x.globalAlpha=1}
if(mt>0){x.globalAlpha=Math.min(1,mt/20);x.textAlign='center';x.font='bold 18px sans-serif';x.fillStyle='#fff';x.strokeText(msg,W/2,130);x.fillText(msg,W/2,130);x.globalAlpha=1}

var map={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'j',KeyW:'j',Space:'j'};
addEventListener('keydown',function(e){var k=map[e.code];if(k&&!pause){K[k]=1;e.preventDefault()}else if(k&&e.code.indexOf('Arrow')==0)e.preventDefault()});
addEventListener('keyup',function(e){var k=map[e.code];if(k)K[k]=0});
